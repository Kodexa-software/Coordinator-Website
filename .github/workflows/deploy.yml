name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether Coordinator changed
        id: check
        if: github.event_name == 'schedule'
        run: |
          latest=$(git ls-remote https://github.com/Kodexa-software/Coordinator.git HEAD | cut -f1)
          deployed=$(curl -fsS --max-time 20 https://coordinator.kodexa.workers.dev/coordinator.json | jq -r '.sha // empty' || true)
          echo "Coordinator HEAD: ${latest:-unknown}; deployed: ${deployed:-unreadable}"
          if [ -n "$latest" ] && [ "$latest" = "$deployed" ]; then
            echo "Up to date, nothing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: npm run build

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
